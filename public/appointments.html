<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointments - Hospital Appointment System</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="navbar-container">
      <a href="/" class="navbar-brand">
        <div class="navbar-brand-icon">
          <i class="fas fa-hospital"></i>
        </div>
        <span class="navbar-brand-text">Health<span>Hub</span></span>
      </a>
      <div class="navbar-menu">
        <a href="/" class="navbar-link">
          <i class="fas fa-home"></i>
          <span>Dashboard</span>
        </a>
        <a href="/patients" class="navbar-link">
          <i class="fas fa-users"></i>
          <span>Patients</span>
        </a>
        <a href="/doctors" class="navbar-link">
          <i class="fas fa-user-md"></i>
          <span>Doctors</span>
        </a>
        <a href="/appointments" class="navbar-link active">
          <i class="fas fa-calendar-check"></i>
          <span>Appointments</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <div class="page-header flex items-center justify-between">
      <div>
        <h1 class="page-title">Appointments</h1>
        <p class="page-subtitle">Manage appointment schedules</p>
      </div>
      <button class="btn btn-primary" onclick="openModal('appointmentModal')">
        <i class="fas fa-calendar-plus"></i>
        New Appointment
      </button>
    </div>

    <!-- Filter Section -->
    <div class="card mb-4">
      <div class="card-body">
        <div class="flex gap-3 items-center" style="flex-wrap: wrap;">
          <div class="form-group mb-0" style="min-width: 200px;">
            <select class="form-control form-select" id="filterPatient" onchange="filterAppointments()">
              <option value="">All Patients</option>
            </select>
          </div>
          <div class="form-group mb-0" style="min-width: 200px;">
            <select class="form-control form-select" id="filterDoctor" onchange="filterAppointments()">
              <option value="">All Doctors</option>
            </select>
          </div>
          <div class="form-group mb-0" style="min-width: 150px;">
            <select class="form-control form-select" id="filterStatus" onchange="filterAppointments()">
              <option value="">All Status</option>
              <option value="scheduled">Scheduled</option>
              <option value="completed">Completed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Appointments Table -->
    <div class="card">
      <div class="card-body">
        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Patient</th>
                <th>Doctor</th>
                <th>Date</th>
                <th>Time</th>
                <th>Status</th>
                <th>Notes</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="appointmentsTable">
              <tr>
                <td colspan="8" class="text-center">
                  <div class="loading-container">
                    <div class="spinner"></div>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Add/Edit Appointment Modal -->
  <div class="modal-overlay" id="appointmentModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="appointmentModalTitle">Schedule New Appointment</h3>
        <button class="modal-close" onclick="closeModal('appointmentModal')">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="modal-body">
        <form id="appointmentForm">
          <input type="hidden" id="appointmentId">
          <div class="form-group">
            <label class="form-label">Patient *</label>
            <select class="form-control form-select" id="appointmentPatient" required>
              <option value="">Select Patient</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Doctor *</label>
            <select class="form-control form-select" id="appointmentDoctor" required>
              <option value="">Select Doctor</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Appointment Date *</label>
            <input type="date" class="form-control" id="appointmentDate" required>
          </div>
          <div class="form-group">
            <label class="form-label">Appointment Time *</label>
            <input type="time" class="form-control" id="appointmentTime" required>
          </div>
          <div class="form-group">
            <label class="form-label">Status</label>
            <select class="form-control form-select" id="appointmentStatus">
              <option value="scheduled">Scheduled</option>
              <option value="completed">Completed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Notes</label>
            <textarea class="form-control" id="appointmentNotes" rows="3" placeholder="Enter any additional notes"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('appointmentModal')">Cancel</button>
        <button class="btn btn-primary" onclick="saveAppointment()">
          <i class="fas fa-save"></i>
          Save Appointment
        </button>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal" style="max-width: 400px;">
      <div class="modal-header">
        <h3 class="modal-title">Confirm Delete</h3>
        <button class="modal-close" onclick="closeModal('deleteModal')">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete this appointment? This action cannot be undone.</p>
        <input type="hidden" id="deleteAppointmentId">
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('deleteModal')">Cancel</button>
        <button class="btn btn-danger" onclick="confirmDeleteAppointment()">
          <i class="fas fa-trash"></i>
          Delete
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    const API_BASE = '/api';
    let allAppointments = [];
    let allPatients = [];
    let allDoctors = [];

    // Toast Notification
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `
        <div class="toast-icon">
          <i class="fas fa-${type === 'success' ? 'check' : 'times'}"></i>
        </div>
        <div class="toast-message">${message}</div>
      `;
      container.appendChild(toast);
      setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // Modal Functions
    function openModal(modalId) {
      document.getElementById(modalId).classList.add('active');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
      if (modalId === 'appointmentModal') {
        document.getElementById('appointmentForm').reset();
        document.getElementById('appointmentId').value = '';
        document.getElementById('appointmentModalTitle').textContent = 'Schedule New Appointment';
      }
    }

    // Fetch Patients and Doctors for dropdowns
    async function fetchDropdowns() {
      try {
        const [patientsRes, doctorsRes] = await Promise.all([
          fetch(`${API_BASE}/patients`),
          fetch(`${API_BASE}/doctors`)
        ]);

        allPatients = await patientsRes.json();
        allDoctors = await doctorsRes.json();

        // Populate patient dropdown in modal
        const patientSelect = document.getElementById('appointmentPatient');
        patientSelect.innerHTML = '<option value="">Select Patient</option>' +
          allPatients.map(p => `<option value="${p.id}">${p.name}</option>`).join('');

        // Populate doctor dropdown in modal
        const doctorSelect = document.getElementById('appointmentDoctor');
        doctorSelect.innerHTML = '<option value="">Select Doctor</option>' +
          allDoctors.map(d => `<option value="${d.id}">Dr. ${d.name} - ${d.specialization}</option>`).join('');

        // Populate filter dropdowns
        const filterPatient = document.getElementById('filterPatient');
        filterPatient.innerHTML = '<option value="">All Patients</option>' +
          allPatients.map(p => `<option value="${p.id}">${p.name}</option>`).join('');

        const filterDoctor = document.getElementById('filterDoctor');
        filterDoctor.innerHTML = '<option value="">All Doctors</option>' +
          allDoctors.map(d => `<option value="${d.id}">Dr. ${d.name}</option>`).join('');
      } catch (error) {
        console.error('Error fetching dropdowns:', error);
      }
    }

    // Fetch All Appointments
    async function fetchAppointments() {
      try {
        const response = await fetch(`${API_BASE}/appointments`);
        allAppointments = await response.json();
        renderAppointments();
      } catch (error) {
        console.error('Error fetching appointments:', error);
        showToast('Error loading appointments', 'error');
      }
    }

    // Render appointments table
    function renderAppointments() {
      const tbody = document.getElementById('appointmentsTable');
      const patientFilter = document.getElementById('filterPatient').value;
      const doctorFilter = document.getElementById('filterDoctor').value;
      const statusFilter = document.getElementById('filterStatus').value;

      let filtered = allAppointments;

      if (patientFilter) {
        filtered = filtered.filter(a => a.patient_id == patientFilter);
      }
      if (doctorFilter) {
        filtered = filtered.filter(a => a.doctor_id == doctorFilter);
      }
      if (statusFilter) {
        filtered = filtered.filter(a => a.status === statusFilter);
      }

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="8">
              <div class="empty-state">
                <div class="empty-state-icon">
                  <i class="fas fa-calendar-xmark"></i>
                </div>
                <h3 class="empty-state-title">No appointments found</h3>
                <p class="empty-state-text">Schedule your first appointment to get started</p>
              </div>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filtered.map(apt => `
        <tr>
          <td>#${apt.id}</td>
          <td><strong>${apt.patient_name || 'N/A'}</strong></td>
          <td>Dr. ${apt.doctor_name || 'N/A'}</td>
          <td>${apt.appointment_date || 'N/A'}</td>
          <td>${apt.appointment_time || 'N/A'}</td>
          <td>
            <span class="badge badge-${apt.status === 'scheduled' ? 'warning' : apt.status === 'completed' ? 'success' : 'danger'}">
              ${apt.status || 'scheduled'}
            </span>
          </td>
          <td>${apt.notes || '-'}</td>
          <td>
            <div class="table-actions">
              <button class="btn btn-outline btn-sm btn-icon" onclick="editAppointment(${apt.id})" title="Edit">
                <i class="fas fa-edit"></i>
              </button>
              <button class="btn btn-danger btn-sm btn-icon" onclick="deleteAppointment(${apt.id})" title="Delete">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    // Filter appointments
    function filterAppointments() {
      renderAppointments();
    }

    // Save Appointment (Create or Update)
    async function saveAppointment() {
      const id = document.getElementById('appointmentId').value;
      const patient_id = document.getElementById('appointmentPatient').value;
      const doctor_id = document.getElementById('appointmentDoctor').value;
      const appointment_date = document.getElementById('appointmentDate').value;
      const appointment_time = document.getElementById('appointmentTime').value;
      const status = document.getElementById('appointmentStatus').value;
      const notes = document.getElementById('appointmentNotes').value.trim();

      if (!patient_id || !doctor_id || !appointment_date || !appointment_time) {
        showToast('Please fill in all required fields', 'error');
        return;
      }

      const appointmentData = { patient_id, doctor_id, appointment_date, appointment_time, status, notes };

      try {
        let response;
        if (id) {
          response = await fetch(`${API_BASE}/appointments/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(appointmentData)
          });
        } else {
          response = await fetch(`${API_BASE}/appointments`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(appointmentData)
          });
        }

        const result = await response.json();

        if (response.ok) {
          showToast(id ? 'Appointment updated successfully' : 'Appointment scheduled successfully');
          closeModal('appointmentModal');
          fetchAppointments();
        } else {
          showToast(result.error || 'Error saving appointment', 'error');
        }
      } catch (error) {
        console.error('Error saving appointment:', error);
        showToast('Error saving appointment', 'error');
      }
    }

    // Edit Appointment
    async function editAppointment(id) {
      try {
        const response = await fetch(`${API_BASE}/appointments/${id}`);
        const appointment = await response.json();

        if (response.ok) {
          document.getElementById('appointmentId').value = appointment.id;
          document.getElementById('appointmentPatient').value = appointment.patient_id;
          document.getElementById('appointmentDoctor').value = appointment.doctor_id;
          document.getElementById('appointmentDate').value = appointment.appointment_date;
          document.getElementById('appointmentTime').value = appointment.appointment_time;
          document.getElementById('appointmentStatus').value = appointment.status || 'scheduled';
          document.getElementById('appointmentNotes').value = appointment.notes || '';
          document.getElementById('appointmentModalTitle').textContent = 'Edit Appointment';
          openModal('appointmentModal');
        } else {
          showToast('Appointment not found', 'error');
        }
      } catch (error) {
        console.error('Error fetching appointment:', error);
        showToast('Error loading appointment data', 'error');
      }
    }

    // Delete Appointment
    function deleteAppointment(id) {
      document.getElementById('deleteAppointmentId').value = id;
      openModal('deleteModal');
    }

    async function confirmDeleteAppointment() {
      const id = document.getElementById('deleteAppointmentId').value;

      try {
        const response = await fetch(`${API_BASE}/appointments/${id}`, {
          method: 'DELETE'
        });

        if (response.ok) {
          showToast('Appointment deleted successfully');
          closeModal('deleteModal');
          fetchAppointments();
        } else {
          const result = await response.json();
          showToast(result.error || 'Error deleting appointment', 'error');
        }
      } catch (error) {
        console.error('Error deleting appointment:', error);
        showToast('Error deleting appointment', 'error');
      }
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      fetchDropdowns();
      fetchAppointments();
    });
  </script>
</body>
</html>
